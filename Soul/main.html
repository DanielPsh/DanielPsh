<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soul (술) — 주류 입문자 가이드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <p class="masthead-kicker">VOL. 01 — 입문자를 위한 주류 가이드</p>
    <h1>Soul <span class="hangul">술</span></h1>
    <p class="tagline">맛과 이야기가 있는 술을 찾아서</p>
  </header>

  <main>
    <section class="controls">
      <input
        type="text"
        id="searchInput"
        placeholder="이름으로 검색"
      />
      <nav class="filters" id="filters"></nav>
      <button id="scanButton" class="fav-toggle">바코드로 찾기</button>
      <button id="favToggle" class="fav-toggle">즐겨찾기만 보기</button>
    </section>

    <div class="list-head">
      <span></span>
      <span>이름</span>
      <span>지역</span>
      <span>가격</span>
      <span></span>
    </div>

    <section class="grid" id="grid"></section>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="scan-overlay" id="scanOverlay">
    <div class="scan-box">
      <button class="modal-close" id="scanClose">&times;</button>
      <video id="scanVideo" playsinline muted></video>
      <p id="scanStatus" class="scan-status"></p>
    </div>
  </div>

  <footer>
    데이터 제공:
    <a href="https://www.thecocktaildb.com/" target="_blank" rel="noopener">TheCocktailDB</a>
    ·
    <a href="https://github.com/alxiw/punkapi" target="_blank" rel="noopener">PunkAPI</a>
    (BrewDog DIY Dog)
    ·
    <a href="https://sampleapis.com/api-list/wines" target="_blank" rel="noopener">SampleAPIs Wines</a>
    ·
    <a href="https://world.openfoodfacts.org/" target="_blank" rel="noopener">Open Food Facts</a>
    (ODbL)
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script src="scan.js"></script>
</body>
</html>
